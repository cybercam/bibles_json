# Regenerates chapters/ and crossrefs/ whenever a bible_*.json changes (or on demand).
name: Split chapters
on:
  push:
    branches: [main]
    paths: ['bible_*.json', 'crossrefs_mobile.json', 'scripts/split_chapters.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get crossrefs from the app repo
        run: curl -sfL -o crossrefs_mobile.json https://raw.githubusercontent.com/cybercam/biblestudywithsteffi/main/src/data/crossrefs_mobile.json || true
      - run: python3 scripts/split_chapters.py --crossrefs crossrefs_mobile.json
      - name: Commit generated files
        run: |
          rm -f crossrefs_mobile.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chapters crossrefs
          git diff --cached --quiet || git commit -m "Regenerate per-chapter files" && git push
