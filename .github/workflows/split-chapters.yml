# Generates per-chapter files for the website Worker and force-pushes them to the `data` branch:
#   chapters/<version>/<book>/<ch>.json, chapters/<version>/index.json, crossrefs/<book>/<ch>.json
# They live off `main` so the Cloudflare Pages site (bibles-json.pages.dev, built from main and
# used by the app for bible_*.json) stays far below Pages' 20,000-file limit.
name: Split chapters
on:
  push:
    branches: [main]
    paths: ['bible_*.json', 'crossrefs_mobile.json', 'scripts/split_chapters.py', '.github/workflows/split-chapters.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/split_chapters.py --root . --crossrefs crossrefs_mobile.json
      - name: Publish to the data branch
        run: |
          mkdir -p "$RUNNER_TEMP/out" && mv chapters crossrefs "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Per-chapter files from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
