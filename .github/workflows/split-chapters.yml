# Regenerates chapters/ and crossrefs/ whenever a bible_*.json changes (or on demand).
name: Split chapters
on:
  push:
    branches: [main]
    paths: ['bible_*.json', 'scripts/split_chapters.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # crossrefs/ is committed once (its source is in the private app repo and rarely changes).
      - run: python3 scripts/split_chapters.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chapters
          git diff --cached --quiet || git commit -m "Regenerate per-chapter files" && git push
